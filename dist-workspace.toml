[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# Build only the released package(s) individually (cargo build -p hitch) instead
# of `--workspace`, so the macOS-only Tauri desktop crate (which needs GTK/gdk on
# Linux) is never compiled on the Linux release runners.
precise-builds = true
# release.yml is hand-tweaked to exclude desktop-v* tags (the desktop app has its
# own workflow), so tell dist not to regenerate/verify the CI files.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app (powershell installer covers Windows)
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "doomedramen/homebrew-hitch"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Whether to install an updater program
install-updater = false
