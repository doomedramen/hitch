# Rust release configuration (similar to goreleaser but for Rust)
# This uses cargo-dist as the Rust equivalent of goreleaser

project_name: hitch
cargo_dist:
  # The directory where the release artifacts are placed
  dist_dir: target/dist

builds:
  - binary: hitch
    main: ./src/main.rs
    # Rust targets instead of goos/goarch
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin

archive:
  format: tar.gz
  name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

release:
  github:
    owner: doomedramen
    name: hitch
  draft: false
  prerelease: false

# Homebrew configuration
brews:
  - name: hitch
    github:
      owner: doomedramen
      name: homebrew-hitch
    homepage: "https://github.com/doomedramen/hitch"
    description: "A CLI tool for managing environment-specific git branches and metadata"
    license: MIT
    test: |
      system "#{bin}/hitch --version"