# .goreleaser.yaml
version: 2

project_name: hitch

builds:
  - binary: hitch
    main: ./src/main.rs
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    flags:
      - --release

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*

release:
  github:
    owner: doomedramen
    name: hitch
  draft: false
  prerelease: false

# Homebrew configuration
brews:
  - name: hitch
    repository:
      owner: doomedramen
      name: homebrew-hitch
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/doomedramen/hitch"
    description: "A CLI tool for managing environment-specific git branches and metadata"
    license: MIT
    test: |
      system "#{bin}/hitch --version"