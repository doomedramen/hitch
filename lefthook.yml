# Lefthook configuration for hitch
# Install with: lefthook install

# Verify lefthook is installed before running any hooks
pre-commit:
  commands:
    # Verify lefthook is properly installed
    verify-hooks:
      run: |
        if [ ! -f ".git/hooks/pre-commit" ] || ! grep -q "lefthook" ".git/hooks/pre-commit" 2>/dev/null; then
          echo "❌ ERROR: Lefthook pre-commit hook is not installed!"
          echo "💡 Run 'lefthook install' to install git hooks"
          echo "💡 This ensures code quality checks run before every commit"
          exit 1
        fi
        echo "✅ Lefthook hooks verified"
      fail_text: |
        🚨 Lefthook is not installed!

        Run 'lefthook install' to install git hooks.
        This is required to ensure code quality and security checks.

    # Rust formatting
    format:
      run: just format-check
      fail_text: |
        🚨 Rust code formatting issues found!

        Run 'just format' to fix formatting issues.

    # Rust linting
    clippy:
      run: just lint
      fail_text: |
        🚨 Clippy found issues!

        Run 'cargo clippy --fix' to automatically fix some issues, or manually address the warnings.

    # Security audit
    audit:
      run: just audit
      fail_text: |
        🚨 Security vulnerabilities found!

        Run 'cargo audit --fix' to automatically update dependencies where possible.

    # Check if Cargo.lock is up to date
    check-lock:
      run: just check
      fail_text: |
        🚨 Cargo.lock is out of sync!

        Run 'just check' to update Cargo.lock.

pre-push:
  commands:
    # Build check (run first to fail fast on compilation issues)
    build:
      run: just build
      fail_text: |
        🚨 Build failed!

        Fix build errors before pushing.

    # Run tests if they exist
    test:
      run: just test
      fail_text: |
        🚨 Tests failed!

        Fix the failing tests before pushing.

# Skip these hooks for specific files or patterns
skip_output:
  - meta
  - success

# Global settings
skip_empty_commit: true
glob: "*.{rs,toml,yml,yaml,md}"

# Allow parallel execution
parallel: true