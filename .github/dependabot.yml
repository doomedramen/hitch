# Dependabot configuration for automated dependency updates
version: 2

updates:
  # Monitor Rust dependencies in Cargo.toml
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "doomedramen"
    assignees:
      - "doomedramen"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "doomedramen"
    assignees:
      - "doomedramen"
    commit-message:
      prefix: "ci"
      include: "scope"