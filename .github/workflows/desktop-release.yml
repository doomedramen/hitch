name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        run: |
          cd crates/hitch-desktop
          pnpm install

      - name: Build desktop bundle
        run: |
          cd crates/hitch-desktop
          pnpm tauri build --bundles dmg

      - name: Find the DMG
        id: find-dmg
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/release/bundle"
          DMG=$(find "${BUNDLE_DIR}" -name "*.dmg" -type f | head -1)
          if [ -z "${DMG}" ]; then
            echo "No DMG found under ${BUNDLE_DIR}"
            exit 1
          fi
          echo "dmg_path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "${DMG}")" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: hash
        run: |
          set -euo pipefail
          echo "sha256=$(shasum -a 256 "${{ steps.find-dmg.outputs.dmg_path }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "${TAG}" "${{ steps.find-dmg.outputs.dmg_path }}" --clobber

      - name: Publish to Homebrew Tap
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          repository: doomedramen/homebrew-hitch
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-hitch

      - name: Write cask file
        env:
          TAG: ${{ github.ref_name }}
          DMG_NAME: ${{ steps.find-dmg.outputs.dmg_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p homebrew-hitch/Casks
          printf '# Cask published with desktop release workflow\n' > homebrew-hitch/Casks/hitch-desktop.rb
          printf '# Created on %s\n\n' "$DATE" >> homebrew-hitch/Casks/hitch-desktop.rb
          printf 'cask "hitch-desktop" do\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  version "%s"\n' "$VERSION" >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  sha256 "%s"\n\n' "$SHA256" >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  url "https://github.com/doomedramen/hitch/releases/download/%s/%s"\n' "$TAG" "$DMG_NAME" >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  name "Hitch Desktop"\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  desc "Git branch management for environment-based deployments"\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  homepage "https://github.com/doomedramen/hitch"\n\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  artifact :app, target: "Hitch Desktop.app"\n\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf '  uninstall quit: "com.doomedramen.hitchdesktop"\n' >> homebrew-hitch/Casks/hitch-desktop.rb
          printf 'end\n' >> homebrew-hitch/Casks/hitch-desktop.rb

      - name: Commit cask
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cd homebrew-hitch
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Casks/hitch-desktop.rb
          git diff --staged --quiet || git commit -m "hitch-desktop ${VERSION}"
          git push