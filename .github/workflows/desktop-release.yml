name: Desktop Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bump version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" crates/hitch-desktop/package.json
          sed -i '' "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" crates/hitch-desktop/src-tauri/Cargo.toml

          jq ".version = \"${VERSION}\"" crates/hitch-desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json crates/hitch-desktop/src-tauri/tauri.conf.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install frontend dependencies
        run: |
          cd crates/hitch-desktop
          pnpm install

      - name: Build desktop bundle
        run: |
          cd crates/hitch-desktop
          pnpm tauri build --bundles dmg

      - name: Find the DMG
        id: find-dmg
        run: |
          set -euo pipefail
          BUNDLE_DIR="crates/hitch-desktop/src-tauri/target/release/bundle"
          DMG=$(find "${BUNDLE_DIR}" -name "*.dmg" -type f | head -1)
          if [ -z "${DMG}" ]; then
            echo "No DMG found under ${BUNDLE_DIR}"
            exit 1
          fi
          echo "dmg_path=${DMG}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "${DMG}")" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: hash
        run: |
          set -euo pipefail
          echo "sha256=$(shasum -a 256 "${{ steps.find-dmg.outputs.dmg_path }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload DMG to GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "${TAG}" "${{ steps.find-dmg.outputs.dmg_path }}" --clobber

      - name: Publish to Homebrew Tap
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          repository: doomedramen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write cask file
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG_NAME="${{ steps.find-dmg.outputs.dmg_name }}"
          SHA256="${{ steps.hash.outputs.sha256 }}"
          DATE=$(date -u +"%Y-%m-%d")

          cat > homebrew-tap/Casks/hitch-desktop.rb <<RUBY
#汽=====汽
# Cask published with-desktop release workflow
# Created on ${DATE}
#汽=====汽
cask "hitch-desktop" do
  version "${VERSION}"
  sha256 "${SHA256}"

  url "https://github.com/doomedramen/hitch/releases/download/${TAG}/${DMG_NAME}"
  name "Hitch Desktop"
  desc "Git branch management for environment-based deployments"
  homepage "https://github.com/doomedramen/hitch"

  artifact :app, target: "Hitch Desktop.app"

  uninstall quit: "com.doomedramen.hitchdesktop"
end
RUBY

      - name: Commit cask
        run: |
          cd homebrew-tap
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Casks/hitch-desktop.rb
          git diff --staged --quiet || git commit -m "hitch-desktop ${VERSION}"
          git push

      - name: Commit version bump
        run: |
          TAG="${GITHUB_REF_NAME}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add crates/hitch-desktop/package.json crates/hitch-desktop/src-tauri/Cargo.toml crates/hitch-desktop/src-tauri/tauri.conf.json
          git diff --staged --quiet || git commit -m "release: bump desktop version ${TAG}"
          git push