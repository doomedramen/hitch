name: Desktop Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-upload:
    name: Build & Upload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: |
          cd crates/hitch-desktop
          pnpm install

      - name: Build desktop bundles
        run: |
          cd crates/hitch-desktop
          pnpm tauri:build

      - name: Wait for cargo-dist release to exist
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          echo "Waiting for GitHub Release to exist for tag: ${TAG}"
          for i in {1..60}; do
            if gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release found."
              exit 0
            fi
            echo "Release not found yet (attempt ${i}/60); sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for release for tag ${TAG}"
          exit 1

      - name: Upload bundles to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"
          BUNDLE_DIR="crates/hitch-desktop/src-tauri/target/release/bundle"
          OUT_DIR="desktop-release-assets"
          mkdir -p "${OUT_DIR}"

          if [ ! -d "${BUNDLE_DIR}" ]; then
            echo "Bundle dir not found: ${BUNDLE_DIR}"
            exit 1
          fi

          # Collect common bundle outputs.
          # Tauri outputs differ by OS and config; upload whatever is produced.
          mapfile -t FILES < <(find "${BUNDLE_DIR}" -type f \( -name "*.AppImage" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \))

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No bundle files found under ${BUNDLE_DIR}"
            exit 1
          fi

          for f in "${FILES[@]}"; do
            base="$(basename "$f")"
            ext="${base#*.}"
            name="hitch-desktop-${TAG}-${RUNNER_OS,,}-${ARCH}.${ext}"
            cp "$f" "${OUT_DIR}/${name}"
          done

          ls -la "${OUT_DIR}"
          gh release upload "${TAG}" "${OUT_DIR}"/* --clobber
