name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - 1.85.0  # Minimum supported version (supports edition 2024)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run format check
      run: just format-check

    - name: Run clippy
      run: just lint

    - name: Run tests
      run: just test-core

  # Run the full CLI test suite on macOS and Windows too, so cross-platform
  # regressions (path handling, file locking, git subprocess behavior) are caught.
  # Uses plain cargo rather than `just` to avoid any shell portability concerns on
  # the Windows runner.
  test-cross-platform:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Configure git for tests
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "Hitch CI"
        git config --global init.defaultBranch main
        git config --global core.autocrlf false

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run CLI test suite
      run: cargo test -p hitch

  desktop-check:
    name: Desktop Build Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Enable corepack (pnpm)
      run: corepack enable

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install Tauri dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Build check
      run: just desktop-check

  build-matrix:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install OpenSSL (macOS)
      if: runner.os == 'macOS'
      run: |
        # Install OpenSSL@3 via Homebrew (native ARM64 build for ARM64 target)
        brew install openssl@3
        OPENSSL_PATH=$(brew --prefix openssl@3)
        echo "OPENSSL_DIR=$OPENSSL_PATH" >> $GITHUB_ENV
        echo "OPENSSL_LIB_DIR=$OPENSSL_PATH/lib" >> $GITHUB_ENV
        echo "OPENSSL_INCLUDE_DIR=$OPENSSL_PATH/include" >> $GITHUB_ENV
        echo "Target: ${{ matrix.target }} (native build)"
        echo "Using OpenSSL path: $OPENSSL_PATH"
        echo "OpenSSL architecture check:"
        file "$OPENSSL_PATH/lib/libssl.dylib" || echo "Could not check architecture"
        file "$OPENSSL_PATH/lib/libcrypto.dylib" || echo "Could not check architecture"

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build binary
      run: just build

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-coverage-

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage report
      run: just coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        fail_ci_if_error: false
        flags: unittests
        name: codecov-umbrella
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate documentation
      run: just docs-ci

    - name: Prepare documentation for GitHub Pages
      run: |
        # Create docs structure for GitHub Pages (configured to deploy from /docs)
        mkdir -p target/pages/docs
        # Copy static files to docs root for relative paths
        cp -r target/doc/static.files target/pages/docs/
        cp target/doc/*.js target/pages/docs/ 2>/dev/null || true
        cp target/doc/*.html target/pages/docs/ 2>/dev/null || true
        cp -r target/doc/search.desc target/pages/docs/ 2>/dev/null || true
        # Copy hitch docs to docs subdirectory
        mkdir -p target/pages/docs/hitch
        cp -r target/doc/hitch/* target/pages/docs/hitch/
        # Add redirect at docs root
        echo '<meta http-equiv="refresh" content="0;url=hitch/index.html">' > target/pages/docs/index.html

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: target/pages
        publish_branch: gh-pages
        force_orphan: true

