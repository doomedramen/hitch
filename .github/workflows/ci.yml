      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: taiki-e/install-action@just

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: just audit

