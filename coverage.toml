# Coverage Configuration for Hitch
# This file defines coverage settings and thresholds for the project

[coverage]
# Minimum coverage percentage required (default: 0% for now)
minimum_threshold = 0

# Coverage tool preference: "llvm-cov" (built-in) or "tarpaulin"
preferred_tool = "llvm-cov"

# Directories to include in coverage
include_dirs = [
    "src/",
    "tests/",
]

# Coverage report format preferences
[reporting]
# Generate text reports for terminal viewing
generate_text = true
# Generate HTML reports for detailed analysis
generate_html = false
# Generate JSON reports for tooling
generate_json = false

# Report output directory
output_dir = "coverage/"

# Coverage thresholds by category
[thresholds]
# Overall coverage threshold (conservative starting point)
overall = 0

# Per-file minimum coverage (files below this will be highlighted)
per_file_minimum = 0

# Critical files that should have higher coverage (when we add unit tests)
[critical_files]
# Files that should eventually maintain 80%+ coverage
high_priority = [
    "src/types.rs",
    "src/utils/git_operations.rs",
    "src/commands/init.rs",
    "src/commands/promote.rs",
    "src/commands/rebuild.rs",
]

# Files that should eventually maintain 90%+ coverage
critical = [
    "src/types.rs",
]

# Notes:
# - Currently this project uses integration tests in tests/ directory
# - Unit tests are planned but not yet implemented
# - Coverage thresholds are set to 0% for now and can be increased as unit tests are added
# - Use 'just test-coverage-summary' for quick coverage reports
# - Use 'just test-coverage-quick' for threshold checking