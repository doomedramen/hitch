[workspace]
members = ["."]
resolver = "2"

[package]
name = "hitch"
version = "1.2.0"
edition = "2021"
authors = ["Martin Page"]
description = "A CLI tool for managing environment-specific git branches and metadata"
license = "MIT"
repository = "https://github.com/doomedramen/hitch"
homepage = "https://github.com/doomedramen/hitch"

[[bin]]
name = "hitch"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored terminal output
colored = "3.0"

# Git operations
git2 = "0.20"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future async commands if needed)
tokio = { version = "1.0", features = ["full"] }

# Dependencies for test binaries
tempfile = "3.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.0"
parking_lot = "0.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Cargo-dist configuration for releases
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# CI backends to support (see 'cargo dist generate-ci')
ci = ["github"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc"
]
# Installers to generate
installers = ["shell", "homebrew"]
# Homebrew configuration
brew = { tap = "doomedramen/homebrew-hitch" }

