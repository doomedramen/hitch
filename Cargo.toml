[package]
name = "hitch"
version = "1.0.0"
edition = "2021"
authors = ["Martin Page"]
description = "A CLI tool for managing environment-specific git branches and metadata"
license = "MIT"

[[bin]]
name = "hitch"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Error handling
anyhow = "1.0"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored terminal output
colored = "2.0"

# Git operations
git2 = "0.18"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future async commands if needed)
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.0"
parking_lot = "0.12"