[workspace]
members = [".", "crates/hitch-desktop/src-tauri"]
resolver = "2"

[package]
name = "hitch"
version = "1.2.49"
edition = "2021"
authors = ["Martin Page"]
description = "A CLI tool for managing environment-specific git branches and metadata"
license = "MIT"
repository = "https://github.com/doomedramen/hitch"
homepage = "https://github.com/doomedramen/hitch"

[[bin]]
name = "hitch"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored terminal output
colored = "3.1"

# Shell completions
clap_complete = "4.5"

# Git operations
git2 = "0.20"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for approval requests
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async runtime (for future async commands if needed)
tokio = { version = "1.49", features = ["full"] }

# Cross-platform OS advisory file locks (flock on Unix, LockFileEx on Windows)
# for atomic, crash-safe repo/rebuild locks.
fs4 = "1"

# Interactive terminal prompts for setup
inquire = "0.7"

# Temporary files (used in git_operations scratch-index)
tempfile = "3.25"

[dev-dependencies]
tempfile = "3.25"
parking_lot = "0.12"
sha2 = "0.10"

[features]
default = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
