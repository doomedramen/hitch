[package]
name = "hitch"
version = "1.1.15"
edition = "2021"
authors = ["Martin Page"]
description = "A CLI tool for managing environment-specific git branches and metadata"
license = "MIT"

[[bin]]
name = "hitch"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored terminal output
colored = "3.0"

# Git operations
git2 = "0.20"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future async commands if needed)
tokio = { version = "1.0", features = ["full"] }

# Dependencies for test binaries
tempfile = "3.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.0"
parking_lot = "0.12"

# Cargo-dist configuration for releases
[package.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.13.3"
# The preferred Rust toolchain to use in CI (rustup toolchain syntax)
rust-toolchain-version = "1.70.0"
# CI backends to support (see 'cargo dist generate-ci')
ci = ["github"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false