[package]
name = "hitch-desktop"
version = "0.0.7"
description = "Hitch Desktop GUI"
authors = ["Martin Page"]
license = "MIT"
repository = "https://github.com/doomedramen/hitch"
edition = "2021"
publish = false

[package.metadata.dist]
dist = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
git2 = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Inset the native macOS traffic lights so they center in the taller unified toolbar.
tauri-plugin-decorum = "1"

# Reuse Hitch's core/command implementation.
hitch = { path = "../../.." }

# Native macOS window vibrancy (NSVisualEffectView) behind the translucent chrome.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
